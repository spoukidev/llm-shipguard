[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-shipguard"
version = "0.1.0"
description = "OpenAI-compatible security gateway for LLM apps: redaction, injection heuristics, canaries, tool allowlists, audit."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ShipGuard contributors" }]
keywords = ["llm", "security", "prompt-injection", "gateway", "fastapi", "ai-security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Framework :: FastAPI",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "sqlmodel>=0.0.16",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
demo = ["openai>=1.30"]
dashboard = ["streamlit>=1.33", "pandas>=2.0"]
presidio = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
classifier = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "openai>=1.30", "ruff>=0.4"]

[project.scripts]
shipguard = "shipguard.server:main"
shipguard-eval = "eval.run_eval:main"

[tool.setuptools.packages.find]
include = ["shipguard*", "mock_upstream*", "demo*", "eval*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501", "B008"]
